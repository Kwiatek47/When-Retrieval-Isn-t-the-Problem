<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      .assistant-md {
        word-break: break-word;
      }
      .assistant-md > :first-child {
        margin-top: 0;
      }
      .assistant-md h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-top: 1rem;
        color: #18181b;
      }
      .assistant-md h2 {
        font-size: 1.125rem;
        font-weight: 600;
        margin-top: 0.875rem;
        color: #18181b;
      }
      .assistant-md h3 {
        font-size: 1rem;
        font-weight: 600;
        margin-top: 0.75rem;
        color: #18181b;
      }
      .assistant-md p {
        margin-top: 0.5rem;
      }
      /* Tailwind preflight resets lists — override inside assistant prose */
      .assistant-md ul {
        margin-top: 0.5rem;
        margin-bottom: 0;
        padding-left: 1.5rem !important;
        list-style-type: disc !important;
        list-style-position: outside !important;
      }
      .assistant-md ol {
        margin-top: 0.5rem;
        margin-bottom: 0;
        padding-left: 1.5rem !important;
        list-style-type: decimal !important;
        list-style-position: outside !important;
      }
      .assistant-md li {
        margin-top: 0.25rem;
        display: list-item !important;
      }
      .assistant-md li > p {
        margin-top: 0.25rem;
      }
      .assistant-md li > p:first-child {
        margin-top: 0;
      }
      .assistant-md blockquote {
        border-left: 3px solid #e4e4e7;
        padding-left: 0.75rem;
        margin-top: 0.5rem;
        color: #52525b;
      }
      .assistant-md code {
        font-size: 0.875em;
        background: #f4f4f5;
        padding: 0.125rem 0.375rem;
        border-radius: 0.25rem;
        font-variant-ligatures: none;
      }
      .assistant-md pre {
        margin-top: 0.5rem;
        padding: 0.75rem;
        background: #f4f4f5;
        border-radius: 0.5rem;
        overflow-x: auto;
        font-size: 0.875rem;
        line-height: 1.5;
      }
      .assistant-md pre code {
        background: transparent;
        padding: 0;
      }
      .assistant-md a {
        color: #0d9488;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .assistant-md a:hover {
        color: #0f766e;
      }
      .assistant-md strong {
        font-weight: 600;
      }
      .assistant-md hr {
        margin: 0.75rem 0;
        border: 0;
        border-top: 1px solid #e4e4e7;
      }
      .assistant-md table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.5rem;
        font-size: 0.875rem;
      }
      .assistant-md th,
      .assistant-md td {
        border: 1px solid #e4e4e7;
        padding: 0.375rem 0.5rem;
        text-align: left;
        vertical-align: top;
      }
      .assistant-md th {
        font-weight: 600;
        background: #fafafa;
      }
    </style>
    <!-- Bundled locally so Markdown renders without CDN (offline / strict CSP) -->
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/purify.min.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body class="h-screen overflow-hidden bg-white font-sans text-zinc-950 antialiased">
    <div class="flex h-screen flex-col">
      <header class="shrink-0 border-b border-zinc-100 bg-white">
        <div class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between px-4 sm:px-6">
          <a href="/" class="flex items-center gap-3" aria-label="MedChat home">
            <span class="grid h-8 w-8 place-items-center rounded-full bg-teal-600 text-sm font-bold text-white">M</span>
            <span class="text-lg font-semibold tracking-normal text-zinc-950">MedChat</span>
          </a>

          <div class="flex min-w-0 items-center justify-end gap-2">
            <span
              id="medicalModelBadge"
              class="inline-flex h-10 shrink-0 items-center gap-1.5 rounded-full border border-teal-200 bg-teal-50 px-3 text-xs font-semibold text-teal-700"
              title="Medical LLM"
              aria-label="Medical LLM"
            >
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
              </svg>
              <span class="hidden sm:inline">Medical LLM</span>
            </span>

            <label class="sr-only" for="modelSelect">Model</label>
            <select
              id="modelSelect"
              class="h-10 w-40 rounded-full border border-zinc-200 bg-white px-4 text-sm font-medium text-zinc-800 shadow-sm outline-none transition hover:border-zinc-300 focus:border-teal-600 focus:ring-4 focus:ring-teal-600/10 sm:w-52"
            >
              <optgroup label="Medical LLMs">
                <option value="gemma4:26b" data-medical="true">Gemma 4 26B</option>
                <option value="medgemma:latest" data-medical="true">MedGemma</option>
                <option value="medgemma:27b" data-medical="true">MedGemma 27B</option>
                <option value="meditron" data-medical="true">Meditron</option>
                <option value="medllama2" data-medical="true">MedLlama2</option>
                <option value="m/biomistral" data-medical="true">BioMistral</option>
              </optgroup>
              <optgroup label="General LLMs">
                <option value="llama3.1">llama3.1</option>
                <option value="llama3.2:1b">llama3.2:1b</option>
                <option value="llama3.2:3b">llama3.2:3b</option>
                <option value="mistral">mistral</option>
                <option value="qwen2.5:7b" selected>qwen2.5:7b</option>
              </optgroup>
            </select>
          </div>
        </div>
      </header>

      <main id="chatViewport" class="flex-1 overflow-y-auto">
        <section id="messages" class="mx-auto flex w-full max-w-3xl flex-col gap-6 px-4 pb-36 pt-8 sm:px-6">
          <article class="max-w-2xl text-[15px] leading-7 text-zinc-700">
            Hello, I am MedChat. Ask a health question and I will keep the answer concise.
          </article>
        </section>
      </main>

      <div class="pointer-events-none fixed inset-x-0 bottom-0 bg-gradient-to-t from-white via-white/95 to-white/0 pb-4 pt-10">
        <form id="chatForm" class="pointer-events-auto mx-auto w-full max-w-3xl px-4 sm:px-6">
          <div class="flex items-end gap-2 rounded-[28px] border border-zinc-200 bg-white px-3 py-2 shadow-lg shadow-zinc-200/70">
            <button
              type="button"
              class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-900 focus:outline-none focus:ring-4 focus:ring-teal-600/10"
              aria-label="Add attachment"
              title="Add attachment"
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
            </button>

            <textarea
              id="promptInput"
              rows="1"
              class="max-h-44 min-h-10 flex-1 resize-none bg-transparent px-1 py-2.5 text-[15px] leading-6 text-zinc-950 outline-none placeholder:text-zinc-400"
              placeholder="Ask a medical question"
              autocomplete="off"
            ></textarea>

            <button
              id="sendButton"
              type="submit"
              class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-zinc-950 text-white transition hover:bg-zinc-800 focus:outline-none focus:ring-4 focus:ring-zinc-950/10 disabled:cursor-not-allowed disabled:bg-zinc-300"
              aria-label="Send message"
              title="Send message"
              disabled
            >
              <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>

  </body>
</html>
